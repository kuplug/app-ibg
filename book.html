<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat buku… — GUE Gen Zedition</title>
<meta name="description" content="">
<link rel="canonical" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,450;1,9..144,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/book.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Obat Toxic <span>／</span></div>
  <div class="nav-toggle" id="navToggle">Daftar Isi</div>
</div>

<div class="index-backdrop" id="indexBackdrop"></div>
<nav class="index-panel" id="indexPanel">
  <span class="label" id="indexLabel">Daftar Isi</span>
  <ul class="index-list" id="indexList"></ul>
</nav>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="hero-content">
    <div class="eyebrow" id="heroEyebrow"></div>
    <div class="hero-grid">
      <div class="hero-text">
        <h1 id="heroTitle"></h1>
        <p class="sub" id="heroSub"></p>
        <div class="meta-row" id="heroMetaRow"></div>
        <div class="pulse-wrap">
          <svg viewBox="0 0 560 70" xmlns="http://www.w3.org/2000/svg">
            <path class="pulse-line" d="" />
          </svg>
          <div class="scroll-cue" id="scrollCue"></div>
        </div>
      </div>
      <div class="book-thumb">
        <img id="bookThumbImg" src="" alt="">
        <span class="cap" id="bookThumbCap"></span>
      </div>
    </div>
  </div>
</section>

<!-- ============ INTRO ============ -->
<section class="intro">
  <span class="label" id="introLabel"></span>
  <div id="introBody"></div>
</section>

<!-- ============ TOC ============ -->
<section class="toc">
  <div class="toc-inner">
    <span class="label" id="tocLabel"></span>
    <h2 id="tocTitle"></h2>
    <div class="toc-grid" id="tocGrid"></div>
  </div>
</section>

<!-- ============ CHAPTERS ============ -->
<div id="chaptersMount"></div>

<!-- ============ CLOSING ============ -->
<section class="closing">
  <div class="closing-inner">
    <span class="label" id="closingLabel"></span>
    <h2 id="closingTitle"></h2>
    <div id="closingBody"></div>
  </div>
</section>

<section class="about">
  <span class="label" id="aboutLabel"></span>
  <h3 id="aboutTitle"></h3>
  <p id="aboutParagraph"></p>
  <div class="tags" id="aboutTags"></div>
</section>

<!-- ============ DOWNLOAD PDF ============ -->
<section class="download-cta" id="downloadCta">
  <div class="download-cta-inner">
    <span class="label" id="ctaLabel"></span>
    <h2 id="ctaTitle"></h2>
    <p id="ctaParagraph"></p>
    <button class="btn-download" id="openQrisModal" type="button">
      <span id="ctaButtonText"></span>
    </button>
  </div>
</section>

<!-- ============ MODAL: QRIS + KONFIRMASI ============ -->
<div class="modal-backdrop" id="qrisModalBackdrop">
  <div class="modal-box">
    <button class="modal-close" id="closeQrisModal" type="button" aria-label="Tutup">✕</button>

    <div id="modalFormState">
      <span class="label" id="modalStep1Label"></span>
      <h3 id="modalTitle"></h3>
      <p style="color:var(--ink-dim); font-size:0.88rem; margin:6px 0 20px;" id="modalDesc"></p>

      <div class="qris-panel">
        <div class="qris-code">
          <img id="qrisImg" src="" alt="QRIS">
        </div>
        <div class="qris-amount" id="qrisAmount"></div>
        <div class="qris-note" id="qrisNote"></div>
      </div>

      <form class="confirm-form" id="confirmForm" novalidate>
        <div>
          <label for="cfName" id="cfNameLabel"></label>
          <input type="text" id="cfName" name="cfName" autocomplete="name" required>
        </div>
        <div>
          <label for="cfContact" id="cfContactLabel"></label>
          <input type="text" id="cfContact" name="cfContact" autocomplete="email" required>
        </div>
        <div>
          <label for="cfNote" id="cfNoteLabel"></label>
          <textarea id="cfNote" name="cfNote"></textarea>
        </div>
        <label class="confirm-check">
          <input type="checkbox" id="cfPaid" name="cfPaid" required>
          <span id="cfCheckLabel"></span>
        </label>
        <span class="confirm-error" id="confirmError"></span>
        <button class="btn-submit" type="submit"><span id="submitBtnText"></span></button>
      </form>
    </div>

    <div class="modal-success" id="modalSuccessState">
      <div class="check"></div>
      <h3 id="successTitle"></h3>
      <p id="successText"></p>
      <p style="font-size:0.8rem; color:var(--ink-faint);" id="manualDownloadWrap"></p>
    </div>
  </div>
</div>

<footer id="siteFooter"></footer>

<script src="js/render.js"></script>
<script src="js/behavior.js"></script>

</body>
</html>
